.pwa-install-fab{
  position:fixed;bottom:18px;right:18px;z-index:1200;
  background:linear-gradient(135deg,#16a34a 0%,#14532d 100%);
  color:white;border:none;border-radius:16px;

  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR','Noto Sans KR Local',sans-serif;line-height:1.3;
  transition:transform .15s,box-shadow .15s;
  animation:pwaFabIn 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards;

  from{opacity:0;transform:scale(0.3) rotate(-25deg);}
  to{opacity:1;transform:scale(1) rotate(0deg);}
}
.pwa-install-fab:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 8px 28px rgba(22,163,74,0.75);}
.pwa-install-fab:active{transform:translateY(0) scale(0.97);}

  position:absolute;top:-7px;right:-7px;

  display:flex;align-items:center;justify-content:center;

  animation:badgePing 2.2s ease-in-out infinite;
}
