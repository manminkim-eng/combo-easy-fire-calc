   ① scale  = (outerW - 16) / 794      (최대 1.0)

   ③ offset = (outerW - scaledW) / 2   ← 픽셀 정중앙
   ④ outer.height = scrollHeight×scale+40  (높이 보정)
   → 데스크탑·태블릿·모바일 전 해상도 정중앙 유지

/* v5.1.0 — 계산 엔진 단일화: 화면 · A4 · 검증(_검증/verify_cis.py)이 같은 cisCalc()를 쓴다
   근거(LawMCP 원문 대조 2026-10-16)
   · 간이스프링클러설비의 화재안전성능기준(NFPC 103A) · 옥내소화전설비의 화재안전성능기준(NFPC 102) 소방청고시 제2025-25호(타법개정, 2026. 3. 1. 시행)
   · 간이스프링클러설비의 화재안전기술기준(NFTC 103A) 국립소방연구원공고 제2024-58호(2024. 12. 1. 시행)

   · 고층건축물의 화재안전기술기준(NFTC 604) 공고 제2023-44호(2023. 12. 20.) */
var FLOW_PER_HYDRANT = 130;  /* 옥내소화전 1개 130 L/min 이상(계산 130) — NFTC 102 2.2.1.3 · 2.2.1.4 */
var H_NOZZLE         = 17;   /* 노즐선단 방수압력 0.17 MPa 이상 ≒ 17 m — NFTC 102 2.2.1.3 */
var SP_NOZZLE        = 10;   /* 간이헤드 선단 방수압력 0.1 MPa 이상 ≒ 10 m — NFPC 103A 제5조① · NFTC 103A 2.2.1 */
var VEL_MAIN         = 4;    /* 펌프 토출 측 주배관 유속 4 m/s 이하 — NFTC 102 2.3.5 */
var VEL_BRANCH       = 6;    /* 수리계산 시 가지배관 6 m/s 이하 — NFTC 103A 2.5.3.3 단서 */
var VEL_OTHER        = 10;   /* 그 밖의 배관 10 m/s 이하 */
var MPA_M            = 0.00980665;

   (NFPC 103A 제4조①2호 · 제5조① · NFTC 103A 2.1.1.2 · 2.2.1) — 간이스프링클러 v5.1.0과 같은 표.
   주차장 표준반응형 헤드 80 L/min 이상(2.2.1 단서 · 2.3.1.7) — 수원에 80 L/min 적용은 MANMIN 해석 */
var BASE_EASY_TYPES = [

/* 강관 내경 = KS 외경 − 2 × 두께 (KS D 3507 · KS D 3562 Sch 40 — 옥내소화전 · 간이스프링클러 · 겸용(옥내+스프) v5.1.0과 같은 규격표).

  65:[2.4,1.30,3.6,0.75,0.48,19.5,10.2,4.6],80:[3.0,1.80,4.5,0.90,0.60,24.0,12.0,5.7],
  100:[4.2,2.40,6.3,1.20,0.81,37.5,16.5,7.6],125:[5.1,3.00,7.5,1.50,0.99,42.0,21.0,10.0],
  150:[6.0,3.60,9.0,1.80,1.20,49.5,24.0,12.0],200:[6.5,3.70,14.0,4.00,1.40,70.0,33.0,15.0],
};

var H_PIPE_SIZES=[40,50,65,80,100,125,150,200];

/* v5.1.0 — 마찰계수(m/100 m). v5.0은 m/m 값을 다시 ÷100 해 손실수두가 1/100로 계산되던 것을 정정 */
function calcFriction(Q,D,pipeType){
  if(!Q||!D)return 0;
  var cfg=PIPE_CONFIG[pipeType]||PIPE_CONFIG.SCH10;
  var Di=cfg.inner[D]; if(!Di)return 0;

  var fl=counts.reduce(function(a,c,j){return a+(+c||0)*eq[j];},0);
  var tl=(+s.len||0)+fl;
  var fric=calcFriction(s.flow,s.dia,pipeType);
  var hl=fric*tl/100;

function cisCalc(spSys,spSegs,hSys,hSegs,cSys,cSegs,buildingFloor){

  var btype=BASE_EASY_TYPES.find(function(x){return x.key===spSys.baseType;})||BASE_EASY_TYPES[0];
  var sA=btype.n, sB=btype.q, sT=btype.t;
  var sClpm=sA*sB;
  var sD=sA*sB*sT/1000;                               /* 수원 = A × B × T ÷ 1,000 */
  var sdets=spSegs.map(function(s){return segDet(s,spSys.pipeType,s.kind==="br"?VEL_BRANCH:VEL_OTHER);});
  var sF=sdets.reduce(function(a,d){return a+d.hl;},0);
  var sE=+spSys.actualHead;

  var sI=sSub*0.1;                                    /* 안전율 10 % · 올림 = MANMIN 참고값 */
  var sJraw=sSub+sI; var sJ=Math.ceil(sJraw);

       (배관 마찰 미차감 · 펌프 성능곡선 미반영 추정 — 보수적) ── */
  var Pdis=J*MPA_M; var hiPress=Pdis>=1.2;

  return {

        <li>Elbow, Tee는 <b>나사접합</b>을 기준으로 한 것임.&nbsp;&nbsp;(용접의 경우 손실을 더 적게 적용)</li>

        <li>Coupling은 <b>직류 Tee</b>와 같다.</li>
        <li>Union, Flange, Socket은 손실수두가 미소하여 <b>생략</b>한다.</li>
        <li>Auto Valve(포소화전 설비), Glove Valve는 <b>Ball Valve</b>와 같다.</li>
        <li>Alarm Valve, Foot Valve 및 Strainer는 <b>Angle Valve</b>와 같다.</li>
      </ol>
    </div>
  </Box>;
}

      '})()" style="background:#7c3aed;color:white;border:none;border-radius:8px;' +
        'padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;">업데이트</button>' +
      '<button onclick="document.getElementById(\'sw-update-banner\').remove()" ' +
        'style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:8px;' +
        'padding:6px 10px;font-size:11px;cursor:pointer;">나중에</button>';
    document.body.appendChild(b);

</script>




<div id="mm-print-stamp" style="display:none">MANMIN-Ver5.0</div>
<script>window.MM_JPG_CONFIG={zone:'#report-zone',name:'옥내간이겸용',prepare:null};</script>



<!-- ═══════════════════════════════════════════════════════════════
     MANMIN 모바일 JPG 저장 v5.5 (v5.4 + R28 소제목 동반 이관 2026-09-05)
     · 인쇄(PDF)와 동일한 계산서 DOM을 캡처한다 → 두 출력물이 어긋날 수 없다
     · 쪽나눔 인식 : .page-break 클래스 + 인라인/계산 스타일(break-before:page) 모두
     · 분할 단위   : 한 장보다 큰 블록은 실측 높이를 보고 자식으로 내려가 잘게 쪼갠다
                    (블록이 통째로 넘어가 앞 장이 비는 현상 방지 · 최대 3단계)
     · 넘침 보호   : 유효높이(261mm) 초과 시 다음 장으로, 표는 행 단위로 분할
                    어떤 경우에도 내용을 잘라내지 않는다 (최후에는 페이지가 늘어난다)
     · 캡처 전 rpt-inner 축소 transform 해제 · document.fonts.ready 대기 · 백지 배경
     · 글자색 상속 : 캡처 페이지는 body 직속이라 #report-zone 의 color 규칙을 못 받는다.
       다크 테마 잔재로 body 가 연회색(#e2e8f0)인 도구에서 본문이 흐리게 찍히므로
       원본 계산서의 실제 글자색을 읽어 캡처 페이지에 명시한다 (밝으면 안전색 강제)
     · 2매 이상이면 저장 시트를 띄운다 — 브라우저는 자동 연속 다운로드를 차단하므로
       페이지마다 사용자가 직접 눌러 저장해야 전부 받을 수 있다 (전체 저장도 제공)
     ═══════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  var CFG = window.MM_JPG_CONFIG || { zone:'#report-zone', name:'MANMIN', prepare:null };
  var VER = 'MANMIN-Ver5.0';

  var MM = function(v){ return v * 96 / 25.4; };
  var PAGE_W = MM(210), PAGE_H = MM(297);
  var PT = MM(14), PR = MM(12), PB = MM(22), PL = MM(14);
  var BODY_H = PAGE_H - PT - PB;                 /* 261mm = 986.5px */

  function two(n){ return (n<10?'0':'') + n; }

  function fileStamp(zone){
    var d = new Date();
    var ymd = d.getFullYear() + two(d.getMonth()+1) + two(d.getDate());
    var name = '';
    try{
      var tds = zone.querySelectorAll('td,th,div,span');
      for(var i=0;i<tds.length && i<400;i++){
        var t = (tds[i].textContent||'').trim();
        if(t.indexOf('공사명') === 0 && t.length < 60){
          name = t.replace(/^공사명\s*:?\s*/,'').trim(); break;
        }
      }
    }catch(e){}
    if(!name || name === '(미입력)') name = '';
    name = name.replace(/[\\\/:*?"<>|\s]+/g,'').slice(0,30);
    return (name ? name + '_' : '') + ymd;
  }

  /* 쪽나눔 판정 — 클래스·인라인 style·computed style 셋 다 본다 */
  function isBreak(el){
    if(!el || el.nodeType !== 1) return false;
    if(el.classList && el.classList.contains('page-break')) return true;
    var st = (el.getAttribute && el.getAttribute('style')) || '';
    if(/break-before\s*:\s*page|page-break-before\s*:\s*always/i.test(st)) return true;
    try{
      var cs = window.getComputedStyle(el);
      if(cs && (cs.breakBefore === 'page' || cs.pageBreakBefore === 'always')) return true;
    }catch(e){}
    return false;
  }
  function isSkipped(el){
    if(!el || el.nodeType !== 1) return true;
    if(el.id === 'dev-stamp' || el.id === 'mm-print-stamp') return true;
    return !!(el.classList && el.classList.contains('no-print'));
  }
  function cleanClone(node){
    var c = node.cloneNode(true);
    if(c.querySelectorAll){
      var junk = c.querySelectorAll('.no-print,#dev-stamp,#mm-print-stamp');
      for(var i=0;i<junk.length;i++){ if(junk[i].parentNode) junk[i].parentNode.removeChild(junk[i]); }
    }
    return c;
  }
  function stampEl(css, text){
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;' + css;
    d.textContent = text;
    return d;
  }

  /* 한 장보다 큰 블록은 자식으로 내려가 분할 단위를 잘게 만든다.
     원본(화면)에서 실측하므로 transform 해제 후에 호출해야 한다. */
  function measure(el){
    try{ return el.getBoundingClientRect().height; }catch(e){ return 0; }
  }
  function flatten(nodes, maxH, depth){
    var out = [];
    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(isSkipped(n)) continue;
      var kids = [];
      if(n.children){
        for(var j=0;j<n.children.length;j++){ if(!isSkipped(n.children[j])) kids.push(n.children[j]); }
      }
      if(depth < 3 && kids.length > 1 && n.tagName !== 'TABLE' && measure(n) > maxH){
        out = out.concat(flatten(kids, maxH, depth + 1));
      }else{
        out.push(n);
      }
    }
    return out;
  }


  function save(shot){
    var a = document.createElement('a');
    a.href = shot.url; a.download = shot.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  /* 2매 이상 저장 시트 — 브라우저는 스크립트가 연속으로 여러 파일을 내려받는 것을
     차단한다. 페이지마다 사용자가 직접 누르면 전부 정상 저장된다. */
  function openSheet(shots){
    var prev = document.getElementById('mm-save-ov');
    if(prev) prev.parentNode.removeChild(prev);
    var ov = document.createElement('div');
    ov.id = 'mm-save-ov';
    ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.62);' +
      'display:flex;align-items:center;justify-content:center;padding:16px;' +
      "font-family:'Noto Sans KR','Noto Sans KR Local',sans-serif;";
    var bx = document.createElement('div');
    bx.style.cssText = 'background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:88vh;' +
      'display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.32);';
    var hd = document.createElement('div');
    hd.style.cssText = 'background:#1E3A5F;color:#fff;padding:14px 18px;display:flex;' +
      'align-items:center;justify-content:space-between;flex-shrink:0;';
    hd.innerHTML = '<b style="font-size:14px;font-weight:700;">🖼️ JPG 저장 — 전체 ' + shots.length + '장</b>' +
      '<span style="font-size:11px;opacity:.8;">페이지별로 눌러 저장하세요</span>';
    var bd = document.createElement('div');
    bd.style.cssText = 'padding:16px 18px;overflow-y:auto;display:grid;gap:12px;' +
      'grid-template-columns:repeat(auto-fill,minmax(150px,1fr));';
    shots.forEach(function(sh){
      var card = document.createElement('div');
      card.style.cssText = 'border:1px solid #E5E7EB;border-radius:10px;overflow:hidden;background:#F8FAFC;';
      var img = document.createElement('img');
      img.src = sh.url;
      img.style.cssText = 'width:100%;display:block;background:#fff;border-bottom:1px solid #E5E7EB;';
      var btn = document.createElement('button');
      btn.textContent = sh.no + ' / ' + shots.length + '  저장';
      btn.style.cssText = 'width:100%;border:none;background:#1E3A5F;color:#fff;padding:9px;' +
        "font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;";
      btn.onclick = function(){ save(sh); btn.textContent = '✓ 저장됨'; btn.style.background = '#15803D'; };
      card.appendChild(img); card.appendChild(btn); bd.appendChild(card);
    });
    var ft = document.createElement('div');
    ft.style.cssText = 'padding:12px 18px;border-top:1px solid #E5E7EB;display:flex;gap:8px;' +
      'justify-content:flex-end;flex-shrink:0;background:#F8FAFC;';
    var all = document.createElement('button');
    all.textContent = '전체 저장 시도';
    all.style.cssText = 'height:38px;padding:0 18px;border-radius:9px;border:1.5px solid #1E3A5F;' +
      "background:#fff;color:#1E3A5F;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;";
    all.onclick = function(){
      shots.forEach(function(sh,i){ setTimeout(function(){ save(sh); }, i*420); });
      all.textContent = '전체 저장 실행됨';
    };
    var cl = document.createElement('button');
    cl.textContent = '닫기';
    cl.style.cssText = 'height:38px;padding:0 18px;border-radius:9px;border:none;' +
      "background:#1E3A5F;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;";
    cl.onclick = function(){ if(ov.parentNode) ov.parentNode.removeChild(ov); };
    ft.appendChild(all); ft.appendChild(cl);
    bx.appendChild(hd); bx.appendChild(bd); bx.appendChild(ft);
    ov.appendChild(bx);
    ov.addEventListener('click', function(e){ if(e.target === ov) cl.onclick(); });
    document.body.appendChild(ov);
  }

  /* 원본 계산서의 실제 글자색을 읽어온다. 너무 밝으면(다크테마 잔재) 안전색으로 바꾼다. */
  function inkOf(el){
    var FALLBACK = '#111827';
    try{
      var c = window.getComputedStyle(el).color || '';
      var m = c.match(/rgba?\(([^)]+)\)/);
      if(!m) return FALLBACK;
      var v = m[1].split(',');
      var r = parseFloat(v[0]), g = parseFloat(v[1]), b = parseFloat(v[2]);
      var a = (v.length > 3) ? parseFloat(v[3]) : 1;
      if(a < 0.7) return FALLBACK;
      var lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      return (lum > 0.55) ? FALLBACK : c;      /* 흰 종이 위에서 흐린 색이면 교체 */
    }catch(e){ return FALLBACK; }
  }

  function Builder(stage, base){
    this.stage = stage;
    this.base  = base || {};
    this.pages = [];
    this.newPage();
  }
  Builder.prototype.newPage = function(){
    var p = document.createElement('div');
    p.style.cssText =
      'position:relative;box-sizing:border-box;background:#FFFFFF;' +
      'width:' + PAGE_W + 'px;min-height:' + PAGE_H + 'px;' +   /* min-height : 잘라내지 않는다 */
      'padding:' + PT + 'px ' + PR + 'px ' + PB + 'px ' + PL + 'px;' +
      'color:' + (this.base.color || '#111827') + ';' +          /* 흐린 글자 방지 */
      'font-size:' + (this.base.fontSize || '13px') + ';' +
      'line-height:' + (this.base.lineHeight || '1.7') + ';' +
      'font-family:' + (this.base.fontFamily || "'Noto Sans KR','Noto Sans KR Local',sans-serif") + ';';
    var b = document.createElement('div');
    b.style.cssText = 'display:flow-root;';                     /* 마진 상쇄 방지 */
    p.appendChild(b); this.stage.appendChild(p);
    this.cur = p; this.body = b; this.pages.push(p);
  };
  Builder.prototype.over  = function(){ return this.body.scrollHeight > BODY_H + 1; };
  Builder.prototype.empty = function(){ return this.body.children.length === 0; };

  Builder.prototype.add = function(node){
    var c = cleanClone(node);
    this.body.appendChild(c);
    if(!this.over()) return;
    if(this.body.children.length > 1){          /* ① 걸리면 통째로 다음 장 */
      this.body.removeChild(c);
      /* v5.5 (2026-09-05 · S10 R28) — 직전 요소가 소제목(짧은 비표 블록)이면 함께 넘긴다.
         인쇄의 .a4-sub+table{break-before:avoid} 와 같은 동작(§17-7). 소제목만 있는 쪽이면 넘기지 않고 아래 행 분할로 간다. */
      var kids = this.body.children, h = kids[kids.length-1];
      var isTit = !!h && h.tagName !== 'TABLE' && !h.querySelector('table') && h.getBoundingClientRect().height < 60;
      if(isTit && kids.length === 1){
        this.body.appendChild(c);
      }else{
        if(isTit) this.body.removeChild(h);
        this.newPage();
        if(isTit) this.body.appendChild(h);
        this.body.appendChild(c);
        if(!this.over()) return;
      }
    }
    this.splitTall(c);                          /* ② 한 장보다 길면 표를 행 단위로 */
  };

  Builder.prototype.splitTall = function(node){
    var table = (node.tagName === 'TABLE') ? node
              : (node.querySelector ? node.querySelector('table') : null);
    var tb = table && table.tBodies && table.tBodies[0];
    if(!tb || tb.rows.length < 3) return;        /* 분할 불가 → 페이지가 늘어날 뿐, 잘리지 않음 */
    var moved = [], guard = 0;
    while(this.over() && tb.rows.length > 1 && guard++ < 2000){
      moved.unshift(tb.rows[tb.rows.length-1]);
      tb.deleteRow(-1);
    }
    if(!moved.length) return;
    var cont = node.cloneNode(true);
    var ctb = (cont.tagName === 'TABLE') ? cont.tBodies[0] : cont.querySelector('tbody');
    if(!ctb) return;
    while(ctb.firstChild) ctb.removeChild(ctb.firstChild);
    for(var i=0;i<moved.length;i++) ctb.appendChild(moved[i]);
    this.newPage();
    this.body.appendChild(cont);
    if(this.over()) this.splitTall(cont);
  };

  Builder.prototype.finish = function(){
    var t = this.pages.length;
    for(var i=0;i<t;i++){
      this.pages[i].appendChild(stampEl(
        'right:' + PR + 'px;bottom:' + MM(9) + 'px;' +
        "font-family:'Orbitron','JetBrains Mono',sans-serif;font-weight:700;" +
        'font-size:8pt;color:#9ca3af;letter-spacing:0.08em;', VER));
      if(t > 1){                                 /* 2매 이상일 때만 쪽번호 */
        this.pages[i].appendChild(stampEl(
          'left:' + PL + 'px;bottom:' + MM(9) + 'px;' +
          "font-family:'JetBrains Mono','Noto Sans KR',monospace;" +
          'font-size:8pt;color:#9ca3af;letter-spacing:0.04em;', (i+1) + ' / ' + t));
      }
    }
    return t;
  };

  window.mmSaveJPG = function(){
    if(CFG.prepare && typeof window[CFG.prepare] === 'function'){
      try{ window[CFG.prepare](); }catch(e){ console.warn('[MANMIN JPG] prepare', e); }
    }
    var zone  = document.querySelector(CFG.zone);
    var inner = document.getElementById('rpt-inner');
    var btn   = document.getElementById('btn-jpg');
    if(!zone){ alert('계산서 영역을 찾지 못했습니다.'); return; }
    if(typeof html2canvas !== 'function'){
      alert('이미지 라이브러리를 불러오지 못했습니다.\n온라인 상태에서 한 번 실행하면 이후 오프라인에서도 저장됩니다.');
      return;
    }

    var label = btn ? btn.textContent : '';
    var keep  = inner ? inner.style.transform : '';
    if(btn){ btn.textContent = '⏳ 생성 중...'; btn.disabled = true; }
    if(inner){ inner.style.transform = 'none'; }

    var stage = document.createElement('div');
    stage.setAttribute('aria-hidden','true');
    stage.style.cssText = 'position:fixed;left:-20000px;top:0;z-index:-1;background:#fff;';
    document.body.appendChild(stage);

    var stamp = fileStamp(zone);
    var top = Array.prototype.slice.call(zone.children);
    var nodes = flatten(top, BODY_H, 0);      /* transform 해제 후 실측 → 분할 단위 결정 */

    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

    ready.then(function(){
      var zs = window.getComputedStyle(zone);
      var b = new Builder(stage, {
        color      : inkOf(zone),
        fontSize   : zs.fontSize,
        lineHeight : zs.lineHeight,
        fontFamily : zs.fontFamily
      });
      nodes.forEach(function(n){
        if(isBreak(n) && !b.empty()) b.newPage();
        b.add(n);
      });
      var total = b.finish();
      var shots = [];
      var chain = Promise.resolve();
      b.pages.forEach(function(page, i){
        chain = chain.then(function(){
          return html2canvas(page, {
            scale: 2, backgroundColor: '#FFFFFF',
            useCORS: true, allowTaint: true, logging: false,
            windowWidth: Math.ceil(PAGE_W), width: Math.ceil(PAGE_W),
            height: Math.ceil(page.getBoundingClientRect().height)
          }).then(function(canvas){
            shots.push({
              url : canvas.toDataURL('image/jpeg', 0.95),
              name: CFG.name + '_' + stamp + (total > 1 ? ('_' + (i+1)) : '') + '.jpg',
              no  : (i+1)
            });
          });
        });
      });
      return chain.then(function(){
        if(shots.length === 1){ save(shots[0]); return; }
        openSheet(shots);          /* 2매 이상 — 브라우저 연속 다운로드 차단 회피 */
      });
    }).catch(function(e){
      console.error('[MANMIN JPG]', e);
      alert('이미지 저장 중 오류가 발생했습니다.\n' + (e && e.message ? e.message : ''));
    }).then(function(){
      if(stage.parentNode) document.body.removeChild(stage);
      if(inner) inner.style.transform = keep;
      if(btn){ btn.textContent = label || '🖼️ JPG 저장'; btn.disabled = false; }
    });
  };
})();
</script>

<script>/* R26 (2026-09-04 · 지시서 §20-15 ③ · S10 소급) — 인쇄 중 문서 제목을 비워 PDF 머리글의 페이지 제목을 지운다. 쪽번호·URL 은 브라우저 옵션 */

<script id="mm-r27">/* R27 (2026-09-04 · S10) — ① html2canvas 는 문서를 복제할 때 브라우저 확장 프로그램이 shadow DOM 에 심은 style 시트(Tailwind .c{transform:rotate(30deg)} · antd 등)까지 본문으로 펼친다.
   화면에서는 격리돼 보이지 않던 규칙이 클론에서 td.c / .r / .k 같은 짧은 클래스에 맞아 JPG 셀이 기울고 행이 부푼다(38 실측 2026-09-04 · 확장 31시트 누출).
